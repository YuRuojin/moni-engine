[package]
name = "moni-engine"
version = "0.1.0"
edition = "2024"
description = "An agent-controllable 2D and 3D game engine with Rust and TypeScript"

[dependencies]
anyhow = "1"
bytemuck = { version = "1", features = ["derive"] }
pollster = "1"
rquickjs = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
ufbx = "0.11.5"
wgpu = "30"
winit = "0.30"
