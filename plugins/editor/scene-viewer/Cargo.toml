[package]
name = "moni-editor"
version = "0.1.0"
edition = "2024"

[lib]
path = "mod.rs"

[dependencies]
anyhow = "1"
# egui 0.37 has empty default features; the editor is not eframe, so it must
# opt into the bundled default fonts itself.
egui = { version = "0.37", features = ["default_fonts"] }
egui-winit = "0.37"
moni-core = { path = "../../../crates/moni-core" }
serde_json = "1"
winit = "0.30"
