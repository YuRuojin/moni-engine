[package]
name = "moni-render"
version = "0.1.0"
edition = "2024"

[lib]
path = "mod.rs"

[dependencies]
serde_json = "1"
anyhow = "1"
bytemuck = { version = "1", features = ["derive"] }
# egui types for the type-erased editor-UI frame hand-off; egui-wgpu 0.37
# re-exports wgpu but not egui itself.
egui = "0.37"
egui-wgpu = "0.37"
moni-assets = { path = "../../assets" }
moni-core = { path = "../../../crates/moni-core" }
pollster = "1"
wgpu = "30"
winit = "0.30"
